name = "nebu-rooms"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Origins allowed to open room sockets. Comma separated; "*.suffix" matches subdomains.
ALLOWED_ORIGINS = "https://nebu.quest,https://www.nebu.quest,https://nebu-quest.pages.dev,*.nebu-quest.pages.dev,http://localhost:*,http://127.0.0.1:*"
MAX_PEERS = "6"
# Optional secrets (set with `wrangler secret put`): TURN_KEY_ID, TURN_KEY_API_TOKEN
